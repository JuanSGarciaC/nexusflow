# Cabeceras de seguridad de la web. nginx no hereda add_header dentro de un location que
# define otros, por eso este archivo se incluye en cada bloque.
#
# CSP: solo código propio. 'unsafe-inline' en estilos es necesario porque Mantine aplica
# variables CSS con atributos style; los scripts no lo permiten.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
