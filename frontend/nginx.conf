# NexusFlow web: sirve la SPA y hace de proxy hacia la API en el MISMO origen.
# Un único origen evita CORS y permite que la cookie de refresh sea SameSite=Strict.

# Plantilla de envsubst (imagen oficial): ${API_UPSTREAM} se sustituye al arrancar.
upstream nexusflow_api {
    server ${API_UPSTREAM};
    keepalive 16;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 1m;

    include /etc/nginx/snippets/security-headers.conf;

    # API y health checks → backend. Se reenvía la IP real del cliente: la API solo confía
    # en estas cabeceras si vienen de este contenedor (FORWARDED_ALLOW_IPS en compose).
    location /api/ {
        proxy_pass http://nexusflow_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /health/ {
        proxy_pass http://nexusflow_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Documentación de la API (si NEXUSFLOW_DOCS_ENABLED=true; si no, la API responde 404).
    location ~ ^/(docs|redoc|openapi\.json)$ {
        proxy_pass http://nexusflow_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Swagger UI carga recursos de un CDN: CSP específica solo para estas rutas.
        include /etc/nginx/snippets/security-headers-docs.conf;
    }

    # /metrics no se publica a través de la web: Prometheus lee la API dentro de la red.
    location = /metrics {
        return 404;
    }

    # Recursos con hash en el nombre: se pueden cachear para siempre.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # SPA: cualquier otra ruta devuelve index.html, que nunca se cachea (así un despliegue
    # nuevo llega de inmediato).
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
}
