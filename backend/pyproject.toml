[project]
name = "nexusflow"
version = "0.1.0"
description = "NexusFlow: plataforma de automatización de procesos empresariales (API)"
license = "MIT"
authors = [
    { name = "JuanSGarciaC", email = "276046067+JuanSGarciaC@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "celery[redis]>=5.6.3",
    "cronsim>=2.7",
    "cryptography>=50.0.2",
    "email-validator>=2.3.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "prometheus-client>=0.26.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pyjwt>=2.15.1",
    "redis>=6.4,<6.5",
    "sqlalchemy[asyncio]>=2.1.6",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
nexusflow = "nexusflow.cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "PT", "N"]
ignore = ["RUF001", "RUF002", "RUF003"]  # se permiten acentos y signos del español

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # assert y valores de prueba en tests
"src/nexusflow/core/errors.py" = ["S101"]  # asserts de tipo en handlers

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["migrations.*"]
ignore_errors = true

# Celery no publica anotaciones de tipos (ni py.typed ni stubs).
[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["nexusflow.engine.worker"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: requiere PostgreSQL y Redis reales (NEXUSFLOW_TEST_DATABASE_URL / NEXUSFLOW_TEST_REDIS_URL)",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["nexusflow"]
branch = true
# models.py solo registra modelos para Alembic (se importa en un subproceso).
omit = ["*/nexusflow/db/models.py"]

[tool.coverage.report]
# Umbral mínimo en CI: la cobertura no puede bajar sin que el pipeline falle.
fail_under = 85
show_missing = false
skip_covered = true
