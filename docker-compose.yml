# Stack de desarrollo y demostración de NexusFlow.
# Uso: copia .env.example a .env, rellena los secretos y ejecuta `docker compose up -d --build`.
#
# Solo la API publica un puerto, y únicamente en 127.0.0.1. PostgreSQL y Redis quedan
# dentro de la red interna de compose.

name: nexusflow

x-backend-env: &backend-env
  NEXUSFLOW_ENV: ${NEXUSFLOW_ENV:-development}
  NEXUSFLOW_LOG_LEVEL: ${NEXUSFLOW_LOG_LEVEL:-INFO}
  NEXUSFLOW_LOG_JSON: ${NEXUSFLOW_LOG_JSON:-true}
  NEXUSFLOW_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-nexusflow}:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}@postgres:5432/${POSTGRES_DB:-nexusflow}
  NEXUSFLOW_REDIS_URL: redis://:${REDIS_PASSWORD:?Define REDIS_PASSWORD en .env}@redis:6379/0
  NEXUSFLOW_SECRET_KEY: ${NEXUSFLOW_SECRET_KEY:?Define NEXUSFLOW_SECRET_KEY en .env}
  NEXUSFLOW_CREDENTIALS_ENCRYPTION_KEYS: ${NEXUSFLOW_CREDENTIALS_ENCRYPTION_KEYS:?Define NEXUSFLOW_CREDENTIALS_ENCRYPTION_KEYS en .env}
  NEXUSFLOW_CORS_ORIGINS: ${NEXUSFLOW_CORS_ORIGINS:-}
  NEXUSFLOW_DOCS_ENABLED: ${NEXUSFLOW_DOCS_ENABLED:-true}
  NEXUSFLOW_ACCESS_TOKEN_TTL_MINUTES: ${NEXUSFLOW_ACCESS_TOKEN_TTL_MINUTES:-15}
  NEXUSFLOW_REFRESH_TOKEN_TTL_DAYS: ${NEXUSFLOW_REFRESH_TOKEN_TTL_DAYS:-7}
  NEXUSFLOW_REGISTRATION_ENABLED: ${NEXUSFLOW_REGISTRATION_ENABLED:-true}
  NEXUSFLOW_COOKIE_SECURE: ${NEXUSFLOW_COOKIE_SECURE:-true}
  NEXUSFLOW_LOGIN_RATE_LIMIT_PER_IP: ${NEXUSFLOW_LOGIN_RATE_LIMIT_PER_IP:-20}
  NEXUSFLOW_LOGIN_RATE_LIMIT_PER_EMAIL: ${NEXUSFLOW_LOGIN_RATE_LIMIT_PER_EMAIL:-10}
  NEXUSFLOW_REGISTER_RATE_LIMIT_PER_IP: ${NEXUSFLOW_REGISTER_RATE_LIMIT_PER_IP:-5}
  NEXUSFLOW_EGRESS_ALLOW_HTTP: ${NEXUSFLOW_EGRESS_ALLOW_HTTP:-false}
  NEXUSFLOW_EGRESS_ALLOWED_PRIVATE_HOSTS: ${NEXUSFLOW_EGRESS_ALLOWED_PRIVATE_HOSTS:-}
  NEXUSFLOW_RUN_MAX_DURATION_HOURS: ${NEXUSFLOW_RUN_MAX_DURATION_HOURS:-48}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexusflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-nexusflow}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Define REDIS_PASSWORD en .env}", "--appendonly", "yes"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Define REDIS_PASSWORD en .env}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Ejecuta las migraciones una vez y termina. La API no arranca si fallan.
  migrate:
    build:
      context: ./backend
    image: nexusflow-backend:local
    command: ["alembic", "upgrade", "head"]
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: nexusflow-backend:local
    environment: *backend-env
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Ejecuta los pasos. Escala por separado de la API: docker compose up --scale worker=3
  worker:
    image: nexusflow-backend:local
    command: ["celery", "-A", "nexusflow.engine.worker:celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    environment: *backend-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    # Al parar, Celery termina las tareas en curso antes de salir (acks_late).
    stop_grace_period: 60s

  # Barrido periódico: reencola mensajes perdidos, recupera pasos de workers caídos y
  # vence ejecuciones fuera de plazo. Debe haber UNA sola instancia.
  beat:
    image: nexusflow-backend:local
    command: ["celery", "-A", "nexusflow.engine.worker:celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    environment: *backend-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  # API externa simulada para demos y CI (perfil "demo"; no forma parte del producto).
  # Para que los flujos puedan llamarla por http dentro de la red de compose, en .env:
  #   NEXUSFLOW_EGRESS_ALLOW_HTTP=true
  #   NEXUSFLOW_EGRESS_ALLOWED_PRIVATE_HOSTS=mock-partner
  mock-partner:
    profiles: ["demo"]
    build:
      context: ./mock-partner
    environment:
      MOCK_PARTNER_CRM_TOKEN: ${MOCK_PARTNER_CRM_TOKEN:-}
      MOCK_PARTNER_PAYMENTS_KEY: ${MOCK_PARTNER_PAYMENTS_KEY:-}
      MOCK_PARTNER_WEBHOOK_SECRET: ${MOCK_PARTNER_WEBHOOK_SECRET:-}
    ports:
      - "127.0.0.1:${MOCK_PARTNER_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
