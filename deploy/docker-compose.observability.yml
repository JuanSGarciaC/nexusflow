# Prometheus + Grafana de referencia. Uso:
#   docker compose -f docker-compose.yml -f deploy/docker-compose.observability.yml up -d
# (añade también -f deploy/docker-compose.prod.yml en producción).
#
# Decisiones:
# - Prometheus NO publica puertos: solo Grafana lo consulta, dentro de la red.
# - Grafana escucha solo en 127.0.0.1:3001; para verlo desde fuera, túnel SSH o un proxy
#   con TLS y autenticación (no lo expongas tal cual).
# - Sin contraseña por defecto: GRAFANA_ADMIN_PASSWORD es obligatoria.
# - Imágenes fijadas por versión.

services:
  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./deploy/observability/secrets/metrics_token:/etc/prometheus/secrets/metrics_token:ro
      - prometheus-data:/prometheus
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.3.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Define GRAFANA_ADMIN_PASSWORD en .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
