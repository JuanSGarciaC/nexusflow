# Prometheus de referencia. Lee la API DENTRO de la red de compose (nginx devuelve 404 en
# /metrics hacia fuera). El token se monta como archivo: ver deploy/observability/README.md.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: nexusflow
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/metrics_token
    static_configs:
      - targets: ["api:8000"]

# Sin Alertmanager configurado: las alertas se ven en la UI de Prometheus y en Grafana.
# Para recibir avisos (correo, Slack, PagerDuty) añade un Alertmanager aquí:
# alerting:
#   alertmanagers:
#     - static_configs: [{ targets: ["alertmanager:9093"] }]
