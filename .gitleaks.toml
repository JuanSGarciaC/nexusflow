# Configuración de gitleaks (CI: gitleaks-action, gitleaks 8.24.x).
# Se usan todas las reglas por defecto y solo se excluye el código de pruebas: contiene
# secretos FICTICIOS a propósito, para verificar que el motor los cifra y los redacta de
# logs, respuestas y auditoría. El código de la aplicación y la documentación se escanean.
title = "nexusflow"

[extend]
useDefault = true

[allowlist]
description = "Secretos ficticios de las pruebas de redacción y cifrado"
paths = [
  '''^backend/tests/''',
  '''^frontend/src/test/''',
]

# Valores de ejemplo concretos y públicos (no son credenciales): placeholders de
# .env.example, la contraseña de demostración de la documentación y la del Postgres
# efímero del CI. Se permite el VALOR, no el archivo: cualquier otro secreto se detecta.
regexes = [
  '''change-me-[a-z0-9-]+''',
  '''demo-clave-larga-2026''',
  '''ci-only-password''',
]
