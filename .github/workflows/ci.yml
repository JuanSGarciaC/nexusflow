name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, tipos, pruebas, auditoría)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexusflow
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: nexusflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nexusflow -d nexusflow_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      NEXUSFLOW_TEST_DATABASE_URL: postgresql+asyncpg://nexusflow:ci-only-password@localhost:5432/nexusflow_test
      NEXUSFLOW_TEST_REDIS_URL: redis://localhost:6379/15
      # Si faltan los servicios, las pruebas de integración fallan en lugar de omitirse.
      NEXUSFLOW_REQUIRE_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.32"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Instalar dependencias (lockfile estricto)
        run: uv sync --locked
      - name: Ruff (lint)
        run: uv run ruff check --output-format=github .
      - name: Ruff (formato)
        run: uv run ruff format --check .
      - name: Mypy (strict)
        run: uv run mypy
      - name: Pytest (unitarias + integración)
        run: uv run pytest
      - name: Auditoría de dependencias
        run: |
          uv export --no-dev --no-emit-project --format requirements.txt -o "$RUNNER_TEMP/requirements.txt"
          uv run pip-audit -r "$RUNNER_TEMP/requirements.txt" --disable-pip

  secrets:
    name: Escaneo de secretos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  compose:
    name: Docker Compose (build + smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generar .env efímero con secretos aleatorios
        run: |
          cp .env.example .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 24)/" .env
          sed -i "s/^REDIS_PASSWORD=.*/REDIS_PASSWORD=$(openssl rand -hex 24)/" .env
          sed -i "s/^NEXUSFLOW_SECRET_KEY=.*/NEXUSFLOW_SECRET_KEY=$(openssl rand -hex 32)/" .env
      - name: Validar compose
        run: docker compose config --quiet
      - name: Construir y levantar el stack
        run: docker compose up -d --build
      - name: Esperar readiness
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health/ready; then echo; exit 0; fi
            sleep 2
          done
          echo "La API no quedó lista a tiempo" >&2
          exit 1
      - name: Verificar errores RFC 9457 y usuario no root
        run: |
          curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/no-existe | grep -q 404
          curl -s http://127.0.0.1:8000/no-existe -D - | grep -qi "content-type: application/problem+json"
          test "$(docker compose exec -T api id -u)" = "10001"
      - name: Crear administrador e iniciar sesión dentro del stack
        run: |
          ADMIN_PASSWORD="$(openssl rand -hex 16)-Ci"
          docker compose exec -T -e NEXUSFLOW_ADMIN_PASSWORD="$ADMIN_PASSWORD" api \
            nexusflow create-admin --email ci-admin@example.com
          TOKEN=$(curl -fsS http://127.0.0.1:8000/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"ci-admin@example.com\",\"password\":\"$ADMIN_PASSWORD\"}" \
            | python3 -c "import sys, json; print(json.load(sys.stdin)['access_token'])")
          curl -fsS http://127.0.0.1:8000/api/v1/users/me -H "Authorization: Bearer $TOKEN" \
            | grep -q '"role":"admin"'
      - name: Logs del stack
        if: always()
        run: docker compose logs --no-color
      - name: Apagar
        if: always()
        run: docker compose down -v
