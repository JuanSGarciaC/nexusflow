name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Los runners van fijados a una versión concreta: `ubuntu-latest` migra a Ubuntu 26
# el 19-oct-2026 y un cambio de imagen no debe romper el CI sin aviso. Dependabot NO
# actualiza `runs-on`: subir de versión es una tarea manual (revisar al salir cada LTS).

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, tipos, pruebas, auditoría)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexusflow
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: nexusflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nexusflow -d nexusflow_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      NEXUSFLOW_TEST_DATABASE_URL: postgresql+asyncpg://nexusflow:ci-only-password@localhost:5432/nexusflow_test
      NEXUSFLOW_TEST_REDIS_URL: redis://localhost:6379/15
      # Si faltan los servicios, las pruebas de integración fallan en lugar de omitirse.
      NEXUSFLOW_REQUIRE_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.32"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Instalar dependencias (lockfile estricto)
        run: uv sync --locked
      - name: Ruff (lint)
        run: uv run ruff check --output-format=github .
      - name: Ruff (formato)
        run: uv run ruff format --check .
      - name: Ruff (mock-partner y scripts)
        run: uv run ruff check ../mock-partner ../scripts && uv run ruff format --check ../mock-partner ../scripts
      - name: Mypy (strict)
        run: uv run mypy
      - name: Pytest (unitarias + integración, cobertura ≥ 85 %)
        run: uv run pytest --cov --cov-report=term
      - name: Contrato OpenAPI versionado al día
        # El frontend genera sus tipos desde backend/openapi.json. Si la API cambia y no se
        # regenera el contrato, el CI falla en lugar de dejar al frontend desincronizado.
        run: |
          uv run nexusflow export-openapi -o "$RUNNER_TEMP/openapi.json"
          diff -u openapi.json "$RUNNER_TEMP/openapi.json"
      - name: Auditoría de dependencias
        run: |
          uv export --no-dev --no-emit-project --format requirements.txt -o "$RUNNER_TEMP/requirements.txt"
          uv run pip-audit -r "$RUNNER_TEMP/requirements.txt" --disable-pip
          uv run pip-audit -r ../mock-partner/requirements.txt --disable-pip

  frontend:
    name: Frontend (lint, tipos, pruebas, build, auditoría)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Activar pnpm (versión de packageManager)
        run: corepack enable
      - name: Instalar dependencias (lockfile estricto)
        run: pnpm install --frozen-lockfile
      - name: Tipos generados coinciden con el contrato OpenAPI
        run: |
          pnpm gen:api
          git diff --exit-code -- src/api/schema.d.ts
      - name: ESLint
        run: pnpm lint
      - name: TypeScript
        run: pnpm typecheck
      - name: Vitest
        run: pnpm test
      - name: Build de producción
        run: pnpm build
      - name: Auditoría de dependencias de producción
        run: pnpm audit --prod --audit-level high

  secrets:
    name: Escaneo de secretos
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Política de gitleaks (la excepción no se amplía y los canarios saltan)
        run: python3 scripts/check_gitleaks_policy.py

  compose:
    name: Docker Compose (build + smoke test)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generar .env efímero con secretos aleatorios
        run: |
          cp .env.example .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 24)/" .env
          sed -i "s/^REDIS_PASSWORD=.*/REDIS_PASSWORD=$(openssl rand -hex 24)/" .env
          sed -i "s/^NEXUSFLOW_SECRET_KEY=.*/NEXUSFLOW_SECRET_KEY=$(openssl rand -hex 32)/" .env
          FERNET=$(openssl rand -base64 32 | tr '+/' '-_')
          sed -i "s|^NEXUSFLOW_CREDENTIALS_ENCRYPTION_KEYS=.*|NEXUSFLOW_CREDENTIALS_ENCRYPTION_KEYS=$FERNET|" .env
          sed -i "s/^MOCK_PARTNER_CRM_TOKEN=.*/MOCK_PARTNER_CRM_TOKEN=$(openssl rand -hex 16)/" .env
          sed -i "s/^MOCK_PARTNER_PAYMENTS_KEY=.*/MOCK_PARTNER_PAYMENTS_KEY=$(openssl rand -hex 16)/" .env
          sed -i "s/^MOCK_PARTNER_WEBHOOK_SECRET=.*/MOCK_PARTNER_WEBHOOK_SECRET=whsec_$(openssl rand -hex 24)/" .env
          # El perfil demo necesita llamar a mock-partner por http dentro de la red de compose.
          sed -i "s/^NEXUSFLOW_EGRESS_ALLOW_HTTP=.*/NEXUSFLOW_EGRESS_ALLOW_HTTP=true/" .env
          sed -i "s/^NEXUSFLOW_EGRESS_ALLOWED_PRIVATE_HOSTS=.*/NEXUSFLOW_EGRESS_ALLOWED_PRIVATE_HOSTS=mock-partner/" .env
      - name: Validar compose
        run: docker compose --profile demo config --quiet
      - name: Construir y levantar el stack (con la API externa simulada)
        run: docker compose --profile demo up -d --build
      - name: Esperar readiness
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health/ready; then echo; exit 0; fi
            sleep 2
          done
          echo "La API no quedó lista a tiempo" >&2
          exit 1
      - name: Verificar errores RFC 9457 y usuario no root
        run: |
          curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/no-existe | grep -q 404
          curl -s http://127.0.0.1:8000/no-existe -D - | grep -qi "content-type: application/problem+json"
          test "$(docker compose exec -T api id -u)" = "10001"
          test "$(docker compose exec -T web id -u)" != "0"
      - name: Web (nginx) sirve la SPA con CSP y hace de proxy a la API
        run: |
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:3000/ && break; sleep 2; done
          HEADERS=$(curl -fsS -D - -o /dev/null http://127.0.0.1:3000/workflows)
          echo "$HEADERS"
          echo "$HEADERS" | grep -qi "content-security-policy: default-src 'self'; script-src 'self'"
          echo "$HEADERS" | grep -qi "x-frame-options: DENY"
          curl -fsS http://127.0.0.1:3000/health/ready | grep -q '"status":"ok"'
          curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/api/v1/users/me | grep -q 401
          curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/metrics | grep -q 404
      - name: Crear administrador e iniciar sesión dentro del stack
        run: |
          ADMIN_PASSWORD="$(openssl rand -hex 16)-Ci"
          echo "$ADMIN_PASSWORD" > /tmp/admin_password
          docker compose exec -T -e NEXUSFLOW_ADMIN_PASSWORD="$ADMIN_PASSWORD" api \
            nexusflow create-admin --email ci-admin@example.com
          TOKEN=$(curl -fsS http://127.0.0.1:8000/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"ci-admin@example.com\",\"password\":\"$ADMIN_PASSWORD\"}" \
            | python3 -c "import sys, json; print(json.load(sys.stdin)['access_token'])")
          curl -fsS http://127.0.0.1:8000/api/v1/users/me -H "Authorization: Bearer $TOKEN" \
            | grep -q '"role":"admin"'
      - name: Ejecutar un flujo a través del worker de Celery
        run: |
          ADMIN_PASSWORD="$(cat /tmp/admin_password)"
          TOKEN=$(curl -fsS http://127.0.0.1:8000/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"ci-admin@example.com\",\"password\":\"$ADMIN_PASSWORD\"}" \
            | python3 -c "import sys, json; print(json.load(sys.stdin)['access_token'])")
          AUTH="Authorization: Bearer $TOKEN"
          WID=$(curl -fsS http://127.0.0.1:8000/api/v1/workflows -H "$AUTH" -H 'Content-Type: application/json' \
            -d '{"name":"smoke","definition":{"inputs":[{"name":"n","type":"integer"}],"start":"t","steps":[{"id":"t","type":"transform","config":{"output":{"n":"{{ input.n }}"}}}]}}' \
            | python3 -c "import sys, json; print(json.load(sys.stdin)['id'])")
          curl -fsS -X POST "http://127.0.0.1:8000/api/v1/workflows/$WID/publish" -H "$AUTH" \
            -H 'Content-Type: application/json' -d '{"expected_revision":1}' > /dev/null
          RID=$(curl -fsS -X POST "http://127.0.0.1:8000/api/v1/workflows/$WID/runs" -H "$AUTH" \
            -H 'Content-Type: application/json' -d '{"input":{"n":7}}' \
            | python3 -c "import sys, json; print(json.load(sys.stdin)['id'])")
          for i in $(seq 1 30); do
            STATUS=$(curl -fsS "http://127.0.0.1:8000/api/v1/runs/$RID" -H "$AUTH" \
              | python3 -c "import sys, json; print(json.load(sys.stdin)['status'])")
            echo "estado: $STATUS"
            if [ "$STATUS" = "succeeded" ]; then exit 0; fi
            if [ "$STATUS" != "pending" ] && [ "$STATUS" != "running" ]; then exit 1; fi
            sleep 2
          done
          exit 1
      - name: Credenciales cifradas y webhooks firmados contra la API externa simulada
        run: |
          set -a; . ./.env; set +a
          TOKEN=$(curl -fsS http://127.0.0.1:8000/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"ci-admin@example.com\",\"password\":\"$(cat /tmp/admin_password)\"}" \
            | python3 -c "import sys, json; print(json.load(sys.stdin)['access_token'])")
          AUTH="Authorization: Bearer $TOKEN"
          J='Content-Type: application/json'
          curl -fsS http://127.0.0.1:8000/api/v1/credentials -H "$AUTH" -H "$J" -d "{\"name\":\"crm\",\"type\":\"bearer_token\",\"allowed_hosts\":[\"mock-partner\"],\"secret\":{\"token\":\"$MOCK_PARTNER_CRM_TOKEN\"}}" > /dev/null
          curl -fsS http://127.0.0.1:8000/api/v1/credentials -H "$AUTH" -H "$J" -d "{\"name\":\"pagos\",\"type\":\"api_key_header\",\"allowed_hosts\":[\"mock-partner\"],\"secret\":{\"header_name\":\"X-Api-Key\",\"value\":\"$MOCK_PARTNER_PAYMENTS_KEY\"}}" > /dev/null
          python3 scripts/ci_payment_flow.py "$TOKEN"
          python3 scripts/ci_webhooks.py "$TOKEN"
          # Ni el token ni la clave aparecen en los logs de ningún contenedor.
          ! docker compose --profile demo logs --no-color | grep -F -e "$MOCK_PARTNER_CRM_TOKEN" -e "$MOCK_PARTNER_PAYMENTS_KEY" -e "$MOCK_PARTNER_WEBHOOK_SECRET"
      - name: Datos de demostración (idempotente)
        run: |
          echo "E2E_PASSWORD=$(openssl rand -hex 12)-Demo" >> "$GITHUB_ENV"
      - name: Sembrar usuarios y flujos demo
        run: |
          set -a; . ./.env; set +a
          docker compose exec -T -e NEXUSFLOW_DEMO_PASSWORD="$E2E_PASSWORD" \
            -e MOCK_PARTNER_CRM_TOKEN="$MOCK_PARTNER_CRM_TOKEN" \
            -e MOCK_PARTNER_PAYMENTS_KEY="$MOCK_PARTNER_PAYMENTS_KEY" \
            api nexusflow seed-demo --runs 2
      - name: Copia de PostgreSQL y restauración verificada
        # El stack sigue vivo (el worker y beat escriben), por eso no se exige igualdad de
        # filas: la copia nunca puede tener MÁS que el origen y debe restaurarse sin errores.
        run: |
          BACKUP_DIR="$RUNNER_TEMP/backups" scripts/backup.sh
          scripts/restore-check.sh "$(ls "$RUNNER_TEMP"/backups/nexusflow-*.dump)"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: E2E con Playwright contra el stack completo (nginx + API + worker)
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          pnpm e2e
      - name: Informe de Playwright (si falla)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
      - name: Logs del stack
        if: always()
        run: docker compose --profile demo logs --no-color
      - name: Apagar
        if: always()
        run: docker compose --profile demo down -v

  trivy:
    name: Imágenes (Trivy HIGH/CRITICAL)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Construir las tres imágenes
        run: |
          docker build -t nf-backend:scan backend
          docker build -t nf-web:scan frontend
          docker build -t nf-mock-partner:scan mock-partner
      # Imagen de Trivy fijada por versión. Falla con vulnerabilidades HIGH/CRITICAL que ya
      # tienen parche (--ignore-unfixed): lo que no se puede arreglar no bloquea el CI.
      - name: Escanear las imágenes
        run: |
          for image in nf-backend nf-web nf-mock-partner; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:0.67.2 image --scanners vuln --severity HIGH,CRITICAL \
              --ignore-unfixed --no-progress --exit-code 1 "$image:scan"
          done
